name: Scanner Opciones Biopharma

on:
  schedule:
    - cron: '30 6 * * 1-5'   # 8:30am hora española (verano UTC+2)
  workflow_dispatch:

jobs:
  enviar-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # necesario para hacer commit del track record

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scanner y enviar email
        env:
          EMAIL_ORIGEN: ${{ secrets.EMAIL_ORIGEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python opciones_biopharma.py

      - name: Guardar track record en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add track_record.json
          git diff --staged --quiet || git commit -m "Track record actualizado $(date +'%Y-%m-%d')"
          git push
